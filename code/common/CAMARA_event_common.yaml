info:
  title: CAMARA common event and subscription data types
  description: |
    Common data types for CAMARA event notification and subscription management.
    This file contains Commonalities-owned schemas that are identical across all
    CAMARA APIs supporting event notifications and/or explicit subscriptions.

    API repositories place this file in `code/common/` alongside `CAMARA_common.yaml`
    and reference schemas via `$ref: "../common/CAMARA_event_common.yaml#/components/schemas/<SchemaName>"`,
    and error responses and examples via the corresponding
    `#/components/responses/...` and `#/components/examples/...` pointers.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  version: wip
  x-camara-commonalities: 0.9.0

components:
  securitySchemes:
    notificationsBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: "{$request.body#/sinkCredential.credentialType}"
      description: |
        Bearer token for notification delivery. Token format is determined
        by `sinkCredential.credentialType` in the subscription request.

  schemas:

    # ─────────────────────────────────────────────────────────────────────────
    # Section 1: CloudEvents 1.0 envelope
    #
    # Pure CloudEvents 1.0 specification envelope. Knows nothing about CAMARA
    # event types, data payloads, or discriminator mappings. Any CAMARA API
    # that needs to send a notification starts here.
    # ─────────────────────────────────────────────────────────────────────────

    CloudEvent:
      type: object
      description: |
        CloudEvents 1.0 specification envelope.
        This schema is the stable base for all CAMARA event notifications.
        It imposes no constraints on `type` values or `data` structure —
        those concerns belong to the API-specific and lifecycle group schemas.
      required:
        - id
        - source
        - specversion
        - type
        - time
      properties:
        id:
          type: string
          maxLength: 256
          description: Identifier of this event, unique within the source context.
        source:
          $ref: "#/components/schemas/Source"
        type:
          type: string
          maxLength: 512
          description: |
            Identifies the event type. CAMARA APIs use reverse-DNS notation:
            `org.camaraproject.<api-name>.<event-version>.<event-name>`
            The api-name segment makes each type globally unique across API groups.
        specversion:
          type: string
          description: Version of the specification to which this event conforms (must be 1.0 if it conforms to cloudevents 1.0.2 version)
          enum:
            - "1.0"
        datacontenttype:
          type: string
          description: 'media-type that describes the event payload encoding, must be "application/json" for CAMARA APIs'
          enum:
            - application/json
        data:
          type: object
          description: Event details payload. Structure is defined by each concrete event schema.
        time:
          $ref: "CAMARA_common.yaml#/components/schemas/DateTime"

    Source:
      type: string
      format: uri-reference
      minLength: 1
      maxLength: 2048
      description: |
        Identifies the context in which an event happened - be a non-empty `URI-reference` like:
        - URI with a DNS authority:
          * https://github.com/cloudevents
          * mailto:cncf-wg-serverless@lists.cncf.io
        - Universally-unique URN with a UUID:
          * urn:uuid:6e8bc430-9c3a-11d9-9669-0800200c9a66
        - Application-specific identifier:
          * /cloudevents/spec/pull/123
          * 1-555-123-4567
      example: "https://notificationSendServer12.example.com"

    # ─────────────────────────────────────────────────────────────────────────
    # Section 2: Subscription management
    #
    # Configuration and identification schemas used by the subscription
    # management endpoints. These are Commonalities-owned and identical
    # across all CAMARA APIs that support explicit subscriptions.
    #
    # ConfigBase is not a complete `Config` schema: it only holds the
    # attributes common to every API project. Each API project MUST define
    # its own `Config` schema locally (extending ConfigBase via `allOf`) to
    # add the required, API-specific `subscriptionDetail` property.
    # ─────────────────────────────────────────────────────────────────────────

    SubscriptionId:
      type: string
      maxLength: 256
      description: The unique identifier of the subscription in the scope of the subscription manager. When this information is contained within an event notification, it SHALL be referred to as `subscriptionId` as per the Commonalities Event Notification Model.
      example: qs15-h556-rt89-1298

    ConfigBase:
      description: |
        Base schema for the `config` object: implementation-specific configuration parameters
        needed by the subscription manager for acquiring events. It defines the attributes
        common to all CAMARA subscription APIs (`subscriptionExpireTime`, `subscriptionMaxEvents`).

        API projects MUST define their own `Config` schema in their main OpenAPI file, extending
        `ConfigBase` via `allOf` to add the required, API-specific `subscriptionDetail` property.
        API projects MAY also add the predefined, optional `initialEvent` property (see sample-service-subscriptions.yaml),
        or omit it if sending a notification at subscription creation time is not relevant to the API’s event type(s).
      type: object
      properties:
        subscriptionExpireTime:
          type: string
          format: date-time
          maxLength: 64
          example: 2023-01-17T13:18:23.682Z
          description: The subscription expiration time (in date-time format) requested by the API consumer. It must follow [RFC 3339](https://datatracker.ietf.org/doc/html/rfc3339#section-5.6) and must have time zone.
        subscriptionMaxEvents:
          type: integer
          format: int32
          description: Identifies the maximum number of event reports to be generated (>=1) requested by the API consumer - Once this number is reached, the subscription ends.
          minimum: 1
          maximum: 1000000
          example: 5

    # ─────────────────────────────────────────────────────────────────────────
    # Section 3: Protocol support
    #
    # Protocol selection and protocol-specific delivery settings.
    # These are Commonalities-owned and identical across all CAMARA APIs.
    # ─────────────────────────────────────────────────────────────────────────

    Protocol:
      type: string
      enum:
        - HTTP
        # Future protocol support (not yet used in CAMARA):
        # - MQTT3
        # - MQTT5
        # - AMQP
        # - NATS
        # - KAFKA
      description: Identifier of a delivery protocol. Only HTTP is allowed for now
      example: "HTTP"

    HTTPSettings:
      type: object
      description: HTTP protocol settings for event delivery.
      properties:
        headers:
          type: object
          description: |-
            A set of key/value pairs that is copied into the HTTP request as custom headers.

            NOTE: Use/Applicability of this concept has not been discussed in Commonalities. When required by an API project as an option to meet a UC/Requirement, please generate an issue for Commonalities discussion about it.
          additionalProperties:
            type: string
            maxLength: 512
        method:
          type: string
          description: The HTTP method to use for sending the message.
          enum:
            - POST

    # Future protocol support (not yet used in CAMARA):
    # MQTTSettings:
    #   type: object
    #   properties:
    #     topicName:
    #       type: string
    #       maxLength: 256
    #       description: MQTT topic name
    #     qos:
    #       type: integer
    #       format: int32
    #       minimum: 0
    #       maximum: 2
    #       description: Quality of Service level (0, 1, or 2)
    #     retain:
    #       type: boolean
    #     expiry:
    #       type: integer
    #       format: int32
    #       minimum: 0
    #       maximum: 2147483647
    #       description: Message expiry interval in seconds
    #     userProperties:
    #       type: object
    #   required:
    #     - topicName

    # AMQPSettings:
    #   type: object
    #   properties:
    #     address:
    #       type: string
    #       maxLength: 512
    #     linkName:
    #       type: string
    #       maxLength: 256
    #     senderSettlementMode:
    #       type: string
    #       enum: ["settled", "unsettled"]
    #     linkProperties:
    #       type: object
    #       additionalProperties:
    #         type: string
    #         maxLength: 1024

    # ApacheKafkaSettings:
    #   type: object
    #   properties:
    #     topicName:
    #       type: string
    #       maxLength: 249
    #     partitionKeyExtractor:
    #       type: string
    #       maxLength: 512
    #     clientId:
    #       type: string
    #       maxLength: 256
    #     ackMode:
    #       type: integer
    #       format: int32
    #       minimum: 0
    #       maximum: 2
    #       description: Acknowledgment mode (0=no ack, 1=leader ack, 2=all replicas ack)
    #   required:
    #     - topicName

    # NATSSettings:
    #   type: object
    #   properties:
    #     subject:
    #       type: string
    #       maxLength: 256
    #       description: NATS subject
    #   required:
    #     - subject

    # ─────────────────────────────────────────────────────────────────────────
    # Section 4: Sink and sink credentials
    #
    # Authentication and authorization information for event delivery.
    # These are Commonalities-owned and identical across all CAMARA APIs.
    # ─────────────────────────────────────────────────────────────────────────

    Sink:
      description: The address to which events shall be delivered using the selected protocol.
      type: string
      format: uri
      maxLength: 2048
      pattern: ^https:\/\/.+$
      example: "https://endpoint.example.com/sink"

    SinkCredential:
      description: A sink credential provides authentication or authorization information necessary to enable delivery of events to a target.
      type: object
      properties:
        credentialType:
          type: string
          enum:
            # - PLAIN  # not used in CAMARA
            - ACCESSTOKEN
            - PRIVATE_KEY_JWT
          description: |
            The type of the credential - MUST be set to ACCESSTOKEN or PRIVATE_KEY_JWT for now
      discriminator:
        propertyName: credentialType
        mapping:
          # PLAIN: "#/components/schemas/PlainCredential"  # not used in CAMARA
          ACCESSTOKEN: "#/components/schemas/AccessTokenCredential"
          PRIVATE_KEY_JWT: "#/components/schemas/PrivateKeyJWTCredential"
      required:
        - credentialType

    # PlainCredential:  # not used in CAMARA
    #   type: object
    #   description: A plain credential as a combination of an identifier and a secret.
    #   allOf:
    #     - $ref: "#/components/schemas/SinkCredential"
    #     - type: object
    #       required:
    #         - identifier
    #         - secret
    #       properties:
    #         identifier:
    #           description: The identifier might be an account or username.
    #           type: string
    #           maxLength: 256
    #         secret:
    #           description: The secret might be a password or passphrase.
    #           type: string
    #           maxLength: 512

    AccessTokenCredential:
      type: object
      description: An access token credential. This type of credential is meant to be used by API Consumers that have limited capabilities to handle authorization requests.
      allOf:
        - $ref: "#/components/schemas/SinkCredential"
        - type: object
          properties:
            accessToken:
              description: REQUIRED. An access token is a token granting access to the target resource.
              type: string
              maxLength: 4096
              writeOnly: true
            accessTokenExpiresUtc:
              type: string
              format: date-time
              maxLength: 64
              description: |
                REQUIRED. An absolute (UTC) timestamp at which the token shall be considered expired.
                In the case of an ACCESS_TOKEN_EXPIRED termination reason, implementation should notify the client before the expiration date.
                If the access token is a JWT and registered "exp" (Expiration Time) claim is present, the two expiry times should match.
                It must follow [RFC 3339](https://datatracker.ietf.org/doc/html/rfc3339#section-5.6) and must have time zone.
              example: "2023-07-03T12:27:08.312Z"
            accessTokenType:
              description: REQUIRED. Type of the access token (See [OAuth 2.0](https://tools.ietf.org/html/rfc6749#section-7.1)).
              type: string
              writeOnly: true
              enum:
                - bearer
          required:
            - accessToken
            - accessTokenExpiresUtc
            - accessTokenType

    PrivateKeyJWTCredential:
      type: object
      description: Use PRIVATE_KEY_JWT to get an access token. This type of credential is to be used by clients that have an authorization server.
      allOf:
        - $ref: "#/components/schemas/SinkCredential"
        - type: object
          properties:
            clientId:
              description: The client ID used to authenticate when requesting an access token using PRIVATE_KEY_JWT.
              type: string
              maxLength: 128
              writeOnly: true
            tokenUri:
              description: The URI where to request an access token using PRIVATE_KEY_JWT.
              type: string
              format: uri
              maxLength: 2048
              pattern: ^https:\/\/.+$
              writeOnly: true
            jwksUri:
              description: The URI used to request the public key to verify that the JWT assertion was signed by PRIVATE_KEY_JWT.
              type: string
              format: uri
              maxLength: 2048
              pattern: ^https:\/\/.+$
              readOnly: true

    # ─────────────────────────────────────────────────────────────────────────
    # Section 5: Subscription lifecycle data
    #
    # Data payload schemas for subscription lifecycle events. These define the
    # `data` content of subscription-started, subscription-updated, and
    # subscription-ended events. The lifecycle event wrappers (which contain
    # api-name placeholders in their event type strings) stay in API templates.
    # ─────────────────────────────────────────────────────────────────────────

    SubscriptionStarted:
      description: Event detail structure for subscription started event
      type: object
      required:
        - initiationReason
        - subscriptionId
      properties:
        initiationReason:
          $ref: "#/components/schemas/InitiationReason"
        subscriptionId:
          $ref: "#/components/schemas/SubscriptionId"
        initiationDescription:
          type: string
          maxLength: 512
          description: Description of subscription initiation

    InitiationReason:
      type: string
      description: |
        - SUBSCRIPTION_CREATED - Subscription created by API Server
      enum:
        - SUBSCRIPTION_CREATED

    SubscriptionUpdated:
      description: Event detail structure for subscription updated event
      type: object
      required:
        - updateReason
        - subscriptionId
      properties:
        updateReason:
          $ref: "#/components/schemas/UpdateReason"
        subscriptionId:
          $ref: "#/components/schemas/SubscriptionId"
        updateDescription:
          type: string
          maxLength: 512
          description: Description of subscription update

    UpdateReason:
      type: string
      description: |
        - SUBSCRIPTION_ACTIVE - API server transitioned subscription status to `ACTIVE`
        - SUBSCRIPTION_INACTIVE - API server transitioned subscription status to `INACTIVE`
      enum:
        - SUBSCRIPTION_ACTIVE
        - SUBSCRIPTION_INACTIVE

    SubscriptionEnded:
      description: Event detail structure for subscription ended event
      type: object
      required:
        - terminationReason
        - subscriptionId
      properties:
        terminationReason:
          $ref: "#/components/schemas/TerminationReason"
        subscriptionId:
          $ref: "#/components/schemas/SubscriptionId"
        terminationDescription:
          type: string
          maxLength: 512
          description: Description of subscription termination

    TerminationReason:
      type: string
      description: |
        - NETWORK_TERMINATED - API server stopped sending notification
        - SUBSCRIPTION_EXPIRED - Subscription expire time (optionally set by the requester) has been reached
        - MAX_EVENTS_REACHED - Maximum number of events (optionally set by the requester) has been reached
        - ACCESS_TOKEN_EXPIRED - Access Token sinkCredential (optionally set by the requester with credential type `ACCESSTOKEN`) expiration time has been reached
        - SUBSCRIPTION_DELETED - Subscription was deleted by the requester
      enum:
        - MAX_EVENTS_REACHED
        - NETWORK_TERMINATED
        - SUBSCRIPTION_EXPIRED
        - ACCESS_TOKEN_EXPIRED
        - SUBSCRIPTION_DELETED

  # ─────────────────────────────────────────────────────────────────────────
  # Subscription-specific error responses
  #
  # Referenceable error responses for subscription management and event
  # notification, extending the generic catalogue in CAMARA_common.yaml with
  # subscription-specific codes. Commonalities-owned and identical across all
  # APIs using explicit subscriptions.
  #
  # Examples are referenced from the shared pools (`components/examples` in
  # CAMARA_common.yaml and in this file). APIs needing other code combinations
  # define error responses locally and reference the same examples — see the
  # intro of `responses` in CAMARA_common.yaml.
  # ─────────────────────────────────────────────────────────────────────────

  responses:
    CreateSubscriptionBadRequest400:
      description: Problem with the client request
      headers:
        x-correlator:
          $ref: "CAMARA_common.yaml#/components/headers/x-correlator"
      content:
        application/json:
          schema:
            allOf:
              - $ref: "CAMARA_common.yaml#/components/schemas/ErrorInfo"
              - type: object
                properties:
                  status:
                    enum:
                      - 400
                  code:
                    enum:
                      - INVALID_ARGUMENT
                      - OUT_OF_RANGE
                      - INVALID_PROTOCOL
                      - INVALID_CREDENTIAL
                      - INVALID_TOKEN
                      - INVALID_SINK
          examples:
            GENERIC_400_INVALID_ARGUMENT:
              $ref: "CAMARA_common.yaml#/components/examples/GENERIC_400_INVALID_ARGUMENT"
            GENERIC_400_OUT_OF_RANGE:
              $ref: "CAMARA_common.yaml#/components/examples/GENERIC_400_OUT_OF_RANGE"
            GENERIC_400_INVALID_PROTOCOL:
              $ref: "#/components/examples/GENERIC_400_INVALID_PROTOCOL"
            GENERIC_400_INVALID_CREDENTIAL:
              $ref: "#/components/examples/GENERIC_400_INVALID_CREDENTIAL"
            GENERIC_400_INVALID_TOKEN:
              $ref: "#/components/examples/GENERIC_400_INVALID_TOKEN"
            GENERIC_400_INVALID_SINK:
              $ref: "#/components/examples/GENERIC_400_INVALID_SINK"

    SubscriptionIdRequired400:
      description: Problem with the client request
      headers:
        x-correlator:
          $ref: "CAMARA_common.yaml#/components/headers/x-correlator"
      content:
        application/json:
          schema:
            allOf:
              - $ref: "CAMARA_common.yaml#/components/schemas/ErrorInfo"
              - type: object
                properties:
                  status:
                    enum:
                      - 400
                  code:
                    enum:
                      - INVALID_ARGUMENT
          examples:
            GENERIC_400_INVALID_ARGUMENT:
              $ref: "CAMARA_common.yaml#/components/examples/GENERIC_400_INVALID_ARGUMENT"
            GENERIC_400_SUBSCRIPTION_ID_REQUIRED:
              $ref: "#/components/examples/GENERIC_400_SUBSCRIPTION_ID_REQUIRED"

    SubscriptionPermissionDenied403:
      description: Client does not have sufficient permission
      headers:
        x-correlator:
          $ref: "CAMARA_common.yaml#/components/headers/x-correlator"
      content:
        application/json:
          schema:
            allOf:
              - $ref: "CAMARA_common.yaml#/components/schemas/ErrorInfo"
              - type: object
                properties:
                  status:
                    enum:
                      - 403
                  code:
                    enum:
                      - PERMISSION_DENIED
                      - SUBSCRIPTION_MISMATCH
          examples:
            GENERIC_403_PERMISSION_DENIED:
              $ref: "CAMARA_common.yaml#/components/examples/GENERIC_403_PERMISSION_DENIED"
            GENERIC_403_SUBSCRIPTION_MISMATCH:
              $ref: "#/components/examples/GENERIC_403_SUBSCRIPTION_MISMATCH"

    CreateSubscriptionConflict409:
      description: Conflict with an existing subscription
      headers:
        x-correlator:
          $ref: "CAMARA_common.yaml#/components/headers/x-correlator"
      content:
        application/json:
          schema:
            allOf:
              - $ref: "CAMARA_common.yaml#/components/schemas/ErrorInfo"
              - type: object
                properties:
                  status:
                    enum:
                      - 409
                  code:
                    enum:
                      - ABORTED
                      - ALREADY_EXISTS
          examples:
            GENERIC_409_ABORTED:
              $ref: "CAMARA_common.yaml#/components/examples/GENERIC_409_ABORTED"
            GENERIC_409_ALREADY_EXISTS:
              $ref: "CAMARA_common.yaml#/components/examples/GENERIC_409_ALREADY_EXISTS"

    # 410 for notification callbacks: the API consumer indicates that the
    # event sink is no longer available
    SinkGone410:
      description: Gone
      headers:
        x-correlator:
          $ref: "CAMARA_common.yaml#/components/headers/x-correlator"
      content:
        application/json:
          schema:
            allOf:
              - $ref: "CAMARA_common.yaml#/components/schemas/ErrorInfo"
              - type: object
                properties:
                  status:
                    enum:
                      - 410
                  code:
                    enum:
                      - GONE
          examples:
            GENERIC_410_GONE:
              $ref: "CAMARA_common.yaml#/components/examples/GENERIC_410_GONE"

    # 422 for subscription creation in APIs identifying their subject with
    # the Device object
    CreateSubscriptionDevice422:
      description: Unprocessable Content
      headers:
        x-correlator:
          $ref: "CAMARA_common.yaml#/components/headers/x-correlator"
      content:
        application/json:
          schema:
            allOf:
              - $ref: "CAMARA_common.yaml#/components/schemas/ErrorInfo"
              - type: object
                properties:
                  status:
                    enum:
                      - 422
                  code:
                    enum:
                      - SERVICE_NOT_APPLICABLE
                      - MISSING_IDENTIFIER
                      - UNSUPPORTED_IDENTIFIER
                      - UNNECESSARY_IDENTIFIER
                      - MULTIEVENT_SUBSCRIPTION_NOT_SUPPORTED
                      - MULTIEVENT_COMBINATION_TEMPORARILY_NOT_SUPPORTED
                      - PRIVATE_KEY_JWT_NOT_CONFIGURED
          examples:
            GENERIC_422_SERVICE_NOT_APPLICABLE:
              $ref: "CAMARA_common.yaml#/components/examples/GENERIC_422_SERVICE_NOT_APPLICABLE"
            GENERIC_422_MISSING_IDENTIFIER_DEVICE:
              $ref: "CAMARA_common.yaml#/components/examples/GENERIC_422_MISSING_IDENTIFIER_DEVICE"
            GENERIC_422_UNSUPPORTED_IDENTIFIER_DEVICE:
              $ref: "CAMARA_common.yaml#/components/examples/GENERIC_422_UNSUPPORTED_IDENTIFIER_DEVICE"
            GENERIC_422_UNNECESSARY_IDENTIFIER_DEVICE:
              $ref: "CAMARA_common.yaml#/components/examples/GENERIC_422_UNNECESSARY_IDENTIFIER_DEVICE"
            GENERIC_422_MULTIEVENT_SUBSCRIPTION_NOT_SUPPORTED:
              $ref: "#/components/examples/GENERIC_422_MULTIEVENT_SUBSCRIPTION_NOT_SUPPORTED"
            GENERIC_422_MULTIEVENT_COMBINATION_TEMPORARILY_NOT_SUPPORTED:
              $ref: "#/components/examples/GENERIC_422_MULTIEVENT_COMBINATION_TEMPORARILY_NOT_SUPPORTED"
            GENERIC_422_PRIVATE_KEY_JWT_NOT_CONFIGURED:
              $ref: "#/components/examples/GENERIC_422_PRIVATE_KEY_JWT_NOT_CONFIGURED"

    # 422 for subscription creation in APIs identifying their subject with
    # a phoneNumber field
    CreateSubscriptionPhoneNumber422:
      description: Unprocessable Content
      headers:
        x-correlator:
          $ref: "CAMARA_common.yaml#/components/headers/x-correlator"
      content:
        application/json:
          schema:
            allOf:
              - $ref: "CAMARA_common.yaml#/components/schemas/ErrorInfo"
              - type: object
                properties:
                  status:
                    enum:
                      - 422
                  code:
                    enum:
                      - SERVICE_NOT_APPLICABLE
                      - MISSING_IDENTIFIER
                      - UNNECESSARY_IDENTIFIER
                      - MULTIEVENT_SUBSCRIPTION_NOT_SUPPORTED
                      - MULTIEVENT_COMBINATION_TEMPORARILY_NOT_SUPPORTED
                      - PRIVATE_KEY_JWT_NOT_CONFIGURED
          examples:
            GENERIC_422_SERVICE_NOT_APPLICABLE:
              $ref: "CAMARA_common.yaml#/components/examples/GENERIC_422_SERVICE_NOT_APPLICABLE"
            GENERIC_422_MISSING_IDENTIFIER_PHONE_NUMBER:
              $ref: "CAMARA_common.yaml#/components/examples/GENERIC_422_MISSING_IDENTIFIER_PHONE_NUMBER"
            GENERIC_422_UNNECESSARY_IDENTIFIER_PHONE_NUMBER:
              $ref: "CAMARA_common.yaml#/components/examples/GENERIC_422_UNNECESSARY_IDENTIFIER_PHONE_NUMBER"
            GENERIC_422_MULTIEVENT_SUBSCRIPTION_NOT_SUPPORTED:
              $ref: "#/components/examples/GENERIC_422_MULTIEVENT_SUBSCRIPTION_NOT_SUPPORTED"
            GENERIC_422_MULTIEVENT_COMBINATION_TEMPORARILY_NOT_SUPPORTED:
              $ref: "#/components/examples/GENERIC_422_MULTIEVENT_COMBINATION_TEMPORARILY_NOT_SUPPORTED"
            GENERIC_422_PRIVATE_KEY_JWT_NOT_CONFIGURED:
              $ref: "#/components/examples/GENERIC_422_PRIVATE_KEY_JWT_NOT_CONFIGURED"

    # ─────────────────────────────────────────────────────────────────────────
    # DEPRECATED — CreateSubscriptionUnprocessableEntity422 bundles the device
    # identifier codes for all subject types. It is DEPRECATED as of
    # Commonalities 0.9.0 and planned for removal in the next meta-release
    # cycle. Use CreateSubscriptionDevice422 or CreateSubscriptionPhoneNumber422
    # instead. Content below is frozen.
    # ─────────────────────────────────────────────────────────────────────────
    CreateSubscriptionUnprocessableEntity422:
      description: Unprocessable Entity
      headers:
        x-correlator:
          $ref: "CAMARA_common.yaml#/components/headers/x-correlator"
      content:
        application/json:
          schema:
            allOf:
              - $ref: "CAMARA_common.yaml#/components/schemas/ErrorInfo"
              - type: object
                properties:
                  status:
                    enum:
                      - 422
                  code:
                    enum:
                      - SERVICE_NOT_APPLICABLE
                      - MISSING_IDENTIFIER
                      - UNSUPPORTED_IDENTIFIER
                      - UNNECESSARY_IDENTIFIER
                      - MULTIEVENT_SUBSCRIPTION_NOT_SUPPORTED
                      - MULTIEVENT_COMBINATION_TEMPORARILY_NOT_SUPPORTED
                      - PRIVATE_KEY_JWT_NOT_CONFIGURED
          examples:
            GENERIC_422_SERVICE_NOT_APPLICABLE:
              description: Service not applicable for the provided identifier
              value:
                status: 422
                code: SERVICE_NOT_APPLICABLE
                message: The service is not available for the provided identifier.
            GENERIC_422_MISSING_IDENTIFIER:
              description: An identifier is not included in the request and the device or phone number identification cannot be derived from the 3-legged access token
              value:
                status: 422
                code: MISSING_IDENTIFIER
                message: The device cannot be identified.
            GENERIC_422_UNSUPPORTED_IDENTIFIER:
              description: None of the provided identifiers is supported by the implementation
              value:
                status: 422
                code: UNSUPPORTED_IDENTIFIER
                message: The identifier provided is not supported.
            GENERIC_422_UNNECESSARY_IDENTIFIER:
              description: An explicit identifier is provided when a device or phone number has already been identified from the access token
              value:
                status: 422
                code: UNNECESSARY_IDENTIFIER
                message: The device is already identified by the access token.
            GENERIC_422_MULTIEVENT_SUBSCRIPTION_NOT_SUPPORTED:
              description: Multi event types subscription is not supported
              value:
                status: 422
                code: MULTIEVENT_SUBSCRIPTION_NOT_SUPPORTED
                message: Multi event types subscription not managed
            GENERIC_422_MULTIEVENT_COMBINATION_TEMPORARILY_NOT_SUPPORTED:
              description: Combination of multiple event types is temporarily not supported
              value:
                status: 422
                code: MULTIEVENT_COMBINATION_TEMPORARILY_NOT_SUPPORTED
                message: The requested combination of event types is temporarily not supported.
            GENERIC_422_PRIVATE_KEY_JWT_NOT_CONFIGURED:
              description: Private key JWT sink credential type is used but no configuration was pre-shared
              value:
                status: 422
                code: PRIVATE_KEY_JWT_NOT_CONFIGURED
                message: No JWK Set configured for PRIVATE_KEY_JWT authentication.

  examples:
    # ─────────────────────────────────────────────────────────────────────────
    # Error examples — subscription-specific reusable ingredients
    #
    # Canonical examples for the subscription-specific CAMARA error codes,
    # complementing the generic pool in `components/examples` of
    # CAMARA_common.yaml. The subscription responses above reference examples
    # from both pools; locally defined error responses in APIs do the same.
    # ─────────────────────────────────────────────────────────────────────────

    # ── 400 Bad Request (subscription creation) ──────────────────────────────
    # Responses: CreateSubscriptionBadRequest400, SubscriptionIdRequired400
    # Examples: the generic 400 examples (CAMARA_common.yaml) plus
    #   GENERIC_400_INVALID_PROTOCOL, GENERIC_400_INVALID_CREDENTIAL,
    #   GENERIC_400_INVALID_TOKEN, GENERIC_400_INVALID_SINK,
    #   GENERIC_400_SUBSCRIPTION_ID_REQUIRED
    GENERIC_400_INVALID_PROTOCOL:
      description: Invalid protocol for events subscription management
      value:
        status: 400
        code: INVALID_PROTOCOL
        message: Only HTTP is supported
    GENERIC_400_INVALID_CREDENTIAL:
      description: Invalid sink credential type
      value:
        status: 400
        code: INVALID_CREDENTIAL
        message: Only Access token or Private key JWT are supported
    GENERIC_400_INVALID_TOKEN:
      description: Invalid access token in the sink credential
      value:
        status: 400
        code: INVALID_TOKEN
        message: Access token in sink credential is invalid or expired
    GENERIC_400_INVALID_SINK:
      description: Invalid sink value
      value:
        status: 400
        code: INVALID_SINK
        message: sink not valid for the specified protocol
    GENERIC_400_SUBSCRIPTION_ID_REQUIRED:
      description: subscription id is required
      value:
        status: 400
        code: INVALID_ARGUMENT
        message: "Expected property is missing: subscriptionId"

    # ── 403 Forbidden (subscriptions) ─────────────────────────────────────────
    # Responses: SubscriptionPermissionDenied403
    # Examples: GENERIC_403_PERMISSION_DENIED (CAMARA_common.yaml) plus
    #   GENERIC_403_SUBSCRIPTION_MISMATCH
    GENERIC_403_SUBSCRIPTION_MISMATCH:
      description: Inconsistent access token for requested subscription
      value:
        status: 403
        code: "SUBSCRIPTION_MISMATCH"
        message: "Inconsistent access token for requested events subscription"

    # ── 409 Conflict / 410 Gone (subscriptions) ──────────────────────────────
    # Responses: CreateSubscriptionConflict409, SinkGone410
    # Examples: GENERIC_409_ABORTED, GENERIC_409_ALREADY_EXISTS and
    #   GENERIC_410_GONE (all in CAMARA_common.yaml)

    # ── 422 Unprocessable Content (subscription creation) ────────────────────
    # Responses: CreateSubscriptionDevice422, CreateSubscriptionPhoneNumber422
    # Examples: the generic 422 examples (CAMARA_common.yaml) plus
    #   GENERIC_422_MULTIEVENT_SUBSCRIPTION_NOT_SUPPORTED,
    #   GENERIC_422_MULTIEVENT_COMBINATION_TEMPORARILY_NOT_SUPPORTED,
    #   GENERIC_422_PRIVATE_KEY_JWT_NOT_CONFIGURED
    GENERIC_422_MULTIEVENT_SUBSCRIPTION_NOT_SUPPORTED:
      description: Multi event types subscription is not supported
      value:
        status: 422
        code: MULTIEVENT_SUBSCRIPTION_NOT_SUPPORTED
        message: Multi event types subscription not managed
    GENERIC_422_MULTIEVENT_COMBINATION_TEMPORARILY_NOT_SUPPORTED:
      description: Combination of multiple event types is temporarily not supported
      value:
        status: 422
        code: MULTIEVENT_COMBINATION_TEMPORARILY_NOT_SUPPORTED
        message: The requested combination of event types is temporarily not supported.
    GENERIC_422_PRIVATE_KEY_JWT_NOT_CONFIGURED:
      description: Private key JWT sink credential type is used but no configuration was pre-shared
      value:
        status: 422
        code: PRIVATE_KEY_JWT_NOT_CONFIGURED
        message: No JWK Set configured for PRIVATE_KEY_JWT authentication.
    # Responses: Local CreateResourceUnprocessableEntity422 in APIs that define it (reference sample-implicit-events.yaml)
    # Examples: the generic 422 examples (CAMARA_common.yaml) plus
    #   GENERIC_422_PRIVATE_KEY_JWT_NOT_CONFIGURED (aforementioned defined),
    #   GENERIC_422_EVENT_NOTIFICATIONS_NOT_SUPPORTED
    GENERIC_422_EVENT_NOTIFICATIONS_NOT_SUPPORTED:
      description: The API provider does not support event notification delivery for this resource
      value:
        status: 422
        code: EVENT_NOTIFICATIONS_NOT_SUPPORTED
        message: Notification delivery is not supported by this API provider. Retry the request without the sink field.
